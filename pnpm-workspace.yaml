packages:
  - apps/*
  - packages/*
  - modules/expo-kbeaconpro
  - modules/expo-pans-ble-api

allowBuilds:
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@expo/cli@56.1.17'
  - '@expo/config-plugins@56.0.10'
  - '@expo/config-types@56.0.7'
  - '@expo/config@56.0.10'
  - '@expo/fingerprint@0.19.5'
  - '@expo/log-box@56.0.14'
  - '@expo/metro-config@56.0.15'
  - '@expo/prebuild-config@56.0.17'
  - '@expo/router-server@56.0.15'
  - '@expo/ui@56.0.19'
  - babel-preset-expo@56.0.16
  - expo-asset@56.0.18
  - expo-constants@56.0.19
  - expo-dev-client@56.0.21
  - expo-dev-launcher@56.0.21
  - expo-dev-menu@56.0.18
  - expo-modules-autolinking@56.0.17
  - expo-modules-core@56.0.18
  - expo-router@56.2.12
  - expo@56.0.13
  - '@expo/metro-runtime@56.0.16'

# Expo recommends pnpm's hoisted node linker for React Native monorepos to avoid
# native build errors and dependency resolution issues with some packages.
nodeLinker: hoisted

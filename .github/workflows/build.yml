# Required GitHub secrets:
#   EXPO_TOKEN
#
# iOS physical-device development/preview builds refresh EAS-managed ad hoc
# provisioning profiles before building. Configure an App Store Connect API key
# for submissions on each EAS project; EAS CLI will fetch that key from the EAS
# credentials service during the non-interactive refresh.
# Local EAS builds cannot use EAS Secret-visibility environment variables; add
# any required build-time values as GitHub Actions secrets/env vars instead.

name: Build

on:
  workflow_dispatch:
    inputs:
      app:
        description: Expo app to build
        type: choice
        required: true
        default: mobile
        options:
          - mobile
          - testbed
      platform:
        description: Platform to build
        type: choice
        required: true
        default: ios
        options:
          - ios
          - android
      profile:
        description: EAS build profile
        type: choice
        required: true
        default: preview
        options:
          - development
          - preview
          - production
          - development-simulator (iOS only)
          - preview-simulator (iOS only)
      run_validation_workflow:
        description: Run validation workflow before building
        type: boolean
        required: true
        default: true

jobs:
  validate:
    if: ${{ inputs.run_validation_workflow }}
    uses: ./.github/workflows/validate.yml

  build:
    needs: [validate]
    if: ${{ always() && (!inputs.run_validation_workflow || needs.validate.result == 'success') }}
    runs-on: ${{ inputs.platform == 'android' && 'ubuntu-24.04' || 'macos-26' }}
    env:
      NODE_OPTIONS: --openssl-legacy-provider
      E2F_ANDROID_VERSION_CODE: ${{ github.run_number }}
      E2F_BUILD_ID: ${{ github.sha }}
    steps:
      - name: Show requested build options
        shell: bash
        env:
          BUILD_APP: ${{ inputs.app }}
          BUILD_PLATFORM: ${{ inputs.platform }}
          BUILD_PROFILE: ${{ inputs.profile }}
          RUN_VALIDATION: ${{ inputs.run_validation_workflow }}
        run: |
          set -euo pipefail
          printf 'App: %s\n' "$BUILD_APP"
          printf 'Platform: %s\n' "$BUILD_PLATFORM"
          printf 'Profile: %s\n' "$BUILD_PROFILE"
          printf 'Run validation workflow: %s\n' "$RUN_VALIDATION"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Free disk space for Android build
        if: ${{ inputs.platform == 'android' }}
        uses: justinthelaw/maximize-github-runner-space@6324f43808f0fd33e16ee8a0141fca09974b38e0 # v0.10.0
        with:
          cleanup-profile: custom
          remove-dotnet: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-swift: "true"
          remove-julia: "true"
          remove-browsers: "true"
          remove-docker-images: "true"
          remove-powershell: "true"
          remove-miniconda: "true"
          remove-homebrew: "true"
          remove-vcpkg: "true"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Setup Java
        if: ${{ inputs.platform == 'android' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        if: ${{ inputs.platform == 'android' }}
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 14742923
          packages: platform-tools

      - name: Show Android SDK versions
        if: ${{ inputs.platform == 'android' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager
          sdkmanager --version
          ls -la "$ANDROID_HOME"
          ls -la "$ANDROID_HOME/cmdline-tools" || true

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Resolve build inputs
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          APP="${{ inputs.app }}"
          PLATFORM="${{ inputs.platform }}"
          PROFILE_INPUT="${{ inputs.profile }}"

          case "$APP" in
            mobile) APP_DIR="apps/mobile"; APP_LABEL="eight2five-mobile" ;;
            testbed) APP_DIR="apps/testbed"; APP_LABEL="eight2five-testbed" ;;
            *) echo "Invalid app: $APP" >&2; exit 1 ;;
          esac

          case "$PLATFORM" in
            ios|android) ;;
            *) echo "Invalid platform: $PLATFORM" >&2; exit 1 ;;
          esac

          case "$PROFILE_INPUT" in
            development) PROFILE="development" ;;
            "development-simulator (iOS only)") PROFILE="development-simulator" ;;
            preview) PROFILE="preview" ;;
            "preview-simulator (iOS only)") PROFILE="preview-simulator" ;;
            production) PROFILE="production" ;;
            *) echo "Invalid profile: $PROFILE_INPUT" >&2; exit 1 ;;
          esac

          if [[ "$PROFILE" == "development-simulator" || "$PROFILE" == "preview-simulator" ]]; then
            if [[ "$PLATFORM" != "ios" ]]; then
              echo "Simulator profiles are only valid for iOS." >&2
              exit 1
            fi
          fi

          case "$PLATFORM:$PROFILE" in
            android:production) EXT="aab" ;;
            android:development|android:preview) EXT="apk" ;;
            ios:development-simulator|ios:preview-simulator) EXT="tar.gz" ;;
            ios:development|ios:preview|ios:production) EXT="ipa" ;;
            *) echo "Invalid platform/profile combination: $PLATFORM/$PROFILE" >&2; exit 1 ;;
          esac

          SHOULD_REFRESH_AD_HOC_PROFILE="false"

          if [[ "$PLATFORM" == "ios" && ( "$PROFILE" == "development" || "$PROFILE" == "preview" ) ]]; then
            SHOULD_REFRESH_AD_HOC_PROFILE="true"
          fi

          ARTIFACT_DIR="$RUNNER_TEMP/eas-local-builds"
          mkdir -p "$ARTIFACT_DIR"
          OUTPUT_PATH="$ARTIFACT_DIR/${APP_LABEL}-${PLATFORM}-${PROFILE}-${GITHUB_RUN_NUMBER}.${EXT}"

          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"
          echo "app_label=$APP_LABEL" >> "$GITHUB_OUTPUT"
          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "should_refresh_ad_hoc_profile=$SHOULD_REFRESH_AD_HOC_PROFILE" >> "$GITHUB_OUTPUT"
          echo "artifact_dir=$ARTIFACT_DIR" >> "$GITHUB_OUTPUT"
          echo "output_path=$OUTPUT_PATH" >> "$GITHUB_OUTPUT"

      - name: Verify EAS CLI supports local output paths
        shell: bash
        run: |
          set -euo pipefail
          if ! npx eas-cli@latest build --help | grep -- "--output" > /dev/null; then
            echo "The installed EAS CLI does not support 'eas build --output'. Refusing to run a local build with an unknown artifact path." >&2
            exit 1
          fi

      - name: Show disk space before build
        shell: bash
        run: |
          set -euo pipefail
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          df -i "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

      - name: Build locally with EAS
        working-directory: ${{ steps.resolve.outputs.app_dir }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ steps.resolve.outputs.artifact_dir }}
        shell: bash
        run: |
          set -euo pipefail

          CMD=(
            npx eas-cli@latest build
            --local
            --platform "${{ steps.resolve.outputs.platform }}"
            --profile "${{ steps.resolve.outputs.profile }}"
            --non-interactive
            --output "${{ steps.resolve.outputs.output_path }}"
          )

          if [[ "${{ steps.resolve.outputs.should_refresh_ad_hoc_profile }}" == "true" ]]; then
            CMD+=(--refresh-ad-hoc-provisioning-profile)
          fi

          "${CMD[@]}"

      - name: Show disk space after build
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          df -i "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

      - name: Verify build artifact exists
        shell: bash
        run: |
          set -euo pipefail
          test -f "${{ steps.resolve.outputs.output_path }}"
          ls -lh "${{ steps.resolve.outputs.output_path }}"

      - name: Verify merged Android BLE manifest
        if: ${{ inputs.platform == 'android' && steps.resolve.outputs.profile != 'production' }}
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST_PATH="$RUNNER_TEMP/merged-AndroidManifest.xml"
          apkanalyzer manifest print "${{ steps.resolve.outputs.output_path }}" > "$MANIFEST_PATH"
          node scripts/verify-pans-android-manifest.mjs \
            "$MANIFEST_PATH" \
            "$E2F_BUILD_ID" \
            "$E2F_ANDROID_VERSION_CODE"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.resolve.outputs.app_label }}-${{ steps.resolve.outputs.platform }}-${{ steps.resolve.outputs.profile }}
          path: ${{ steps.resolve.outputs.output_path }}
          if-no-files-found: error
          retention-days: 7

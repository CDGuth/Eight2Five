name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_native_module_compilation:
        description: Compile production iOS and Android native-module bridges
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      run_native_module_compilation:
        description: Compile production iOS and Android native-module bridges
        required: false
        default: false
        type: boolean

jobs:
  validate:
    runs-on: macos-26
    env:
      NODE_OPTIONS: --openssl-legacy-provider
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.3.3"
          skip-verify-signature: true

      - name: Setup Android SDK
        if: ${{ github.event_name == 'pull_request' || inputs.run_native_module_compilation }}
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 14742923
          packages: platform-tools

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run syncpack lint
        run: npm run syncpack:lint

      - name: Run type checks
        run: npm run type-check

      - name: Run tests
        run: npm run test

      - name: Run Expo doctor
        run: npm run validate:expo:doctor

      - name: Run Expo install check
        run: npm run validate:expo:install-check

      - name: Compile production native modules
        if: ${{ github.event_name == 'pull_request' || inputs.run_native_module_compilation }}
        run: npm run test:native:compile

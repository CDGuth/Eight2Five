name: Validate

on:
  push:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      NODE_OPTIONS: --openssl-legacy-provider
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run syncpack lint
        run: npm run syncpack:lint

      - name: Run type checks
        run: npm run type-check

      - name: Run tests
        run: npm run test

      - name: Run Expo doctor
        run: npm run validate:expo:doctor

      - name: Run Expo install check
        run: npm run validate:expo:install-check

  native-module-tests:
    name: Native module tests
    runs-on: macos-26
    env:
      NODE_OPTIONS: --openssl-legacy-provider
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Run expo-pans-ble-api native tests
        run: npm run test:native:expo-pans-ble-api

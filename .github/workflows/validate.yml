name: Validate

on:
  push:
  workflow_dispatch:
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      NODE_OPTIONS: --openssl-legacy-provider
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.3.3"
          skip-verify-signature: true

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run syncpack lint
        run: npm run syncpack:lint

      - name: Run type checks
        run: npm run type-check

      - name: Run tests
        run: npm run test

      - name: Run Expo doctor
        run: npm run expo:doctor

      - name: Run Expo install check
        run: npm run expo:install-check
